name: Deploy Backend

# Repository variables: BACKEND_DEPLOY_HOST, BACKEND_DEPLOY_USER, BACKEND_SSH_PORT,
# BACKEND_PROJECT_PATH, BACKEND_SERVICE_NAME.
# Repository secret: BACKEND_DEPLOY_SSH_PASSWORD.
# BACKEND_PROJECT_PATH is the remote project root; the service must allow
# passwordless sudo for systemctl restart.

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "requirements.txt"

permissions:
  contents: read

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out merged commit
        uses: actions/checkout@v4

      - name: Install SSH and rsync tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends rsync sshpass

      - name: Upload app and restart backend service
        env:
          DEPLOY_HOST: ${{ vars.BACKEND_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.BACKEND_DEPLOY_USER }}
          SSH_PORT: ${{ vars.BACKEND_SSH_PORT || '9114' }}
          PROJECT_PATH: ${{ vars.BACKEND_PROJECT_PATH }}
          SERVICE_NAME: ${{ vars.BACKEND_SERVICE_NAME }}
          SSHPASS: ${{ secrets.BACKEND_DEPLOY_SSH_PASSWORD }}
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?Set the BACKEND_DEPLOY_HOST repository variable}"
          : "${DEPLOY_USER:?Set the BACKEND_DEPLOY_USER repository variable}"
          : "${PROJECT_PATH:?Set the BACKEND_PROJECT_PATH repository variable}"
          : "${SERVICE_NAME:?Set the BACKEND_SERVICE_NAME repository variable}"
          : "${SSHPASS:?Set the BACKEND_DEPLOY_SSH_PASSWORD repository secret}"
          if ! [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] || (( SSH_PORT < 1 || SSH_PORT > 65535 )); then
            echo "::error::SSH port must be between 1 and 65535"
            exit 1
          fi
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::DEPLOY_HOST has an invalid format"; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]*$ ]] || { echo "::error::DEPLOY_USER has an invalid format"; exit 1; }
          [[ "$PROJECT_PATH" =~ ^/[A-Za-z0-9._/-]+$ && "$PROJECT_PATH" != "/" ]] || { echo "::error::BACKEND_PROJECT_PATH must be an absolute path without spaces"; exit 1; }
          [[ "$SERVICE_NAME" =~ ^[A-Za-z0-9_.@:-]+$ ]] || { echo "::error::BACKEND_SERVICE_NAME has an invalid format"; exit 1; }
          PROJECT_PATH="${PROJECT_PATH%/}"

          ssh_options=(
            -p "$SSH_PORT"
            -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=15
            -o PreferredAuthentications=password,keyboard-interactive
            -o PubkeyAuthentication=no
          )

          sshpass -e ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$PROJECT_PATH/app'"

          rsync_ssh="sshpass -e ssh -p $SSH_PORT -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no"
          sshpass -e rsync --archive --compress --delete \
            --exclude='.env*' \
            --exclude='__pycache__/' \
            --exclude='*.py[cod]' \
            --exclude='*.sqlite*' \
            --exclude='*.db' \
            --rsh="$rsync_ssh" \
            app/ "$DEPLOY_USER@$DEPLOY_HOST:$PROJECT_PATH/app/"

          sshpass -e rsync --archive --compress \
            --rsh="$rsync_ssh" \
            requirements.txt "$DEPLOY_USER@$DEPLOY_HOST:$PROJECT_PATH/requirements.txt"

          sshpass -e ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$PROJECT_PATH' && python3 -m venv .venv && .venv/bin/pip install --disable-pip-version-check -r requirements.txt && sudo -n systemctl restart '$SERVICE_NAME'"
